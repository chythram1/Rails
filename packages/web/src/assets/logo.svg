<svg class="logo-armadillo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" width="180" height="110" role="img" aria-labelledby="armadillo-title armadillo-desc">
  <title id="armadillo-title">Armadillo</title>
  <desc id="armadillo-desc">A right-facing armadillo made of rounded bars: a low domed shell, pointed nose, upright ear and long segmented tail. Hover or hold it down to see it walk in place.</desc>
  <style>
    .logo-armadillo { --ink: currentColor; --detail: #898989; }
    .logo-armadillo .armadillo-ink { fill: var(--ink); }
    .logo-armadillo .armadillo-foot { fill: var(--detail); }
    .logo-armadillo .armadillo-motion { animation-duration: 1.4s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    .logo-armadillo .armadillo-tail { transform-box: fill-box; transform-origin: center; animation-name: var(--armadillo-wave, none); animation-delay: var(--lag); }
    .logo-armadillo .armadillo-band { transform-box: fill-box; transform-origin: center bottom; animation-name: var(--armadillo-ripple, none); animation-delay: var(--lag); }
    .logo-armadillo .armadillo-head { animation-name: var(--armadillo-bob, none); }
    .logo-armadillo .armadillo-foot-a { animation-name: var(--armadillo-step-a, none); }
    .logo-armadillo .armadillo-foot-b { animation-name: var(--armadillo-step-b, none); }
    .logo-armadillo:active { --armadillo-wave: armadillo-tail-wave; --armadillo-ripple: armadillo-shell-ripple; --armadillo-bob: armadillo-head-bob; --armadillo-step-a: armadillo-step-front; --armadillo-step-b: armadillo-step-back; }
    @media (hover: hover) {
      .logo-armadillo:hover { --armadillo-wave: armadillo-tail-wave; --armadillo-ripple: armadillo-shell-ripple; --armadillo-bob: armadillo-head-bob; --armadillo-step-a: armadillo-step-front; --armadillo-step-b: armadillo-step-back; }
    }
    @keyframes armadillo-tail-wave {
      0%, 100% { transform: translateY(0) scaleY(1); }
      30% { transform: translateY(var(--lift)) scaleY(1.3); }
      72% { transform: translateY(var(--drop)) scaleY(.94); }
    }
    @keyframes armadillo-shell-ripple {
      0%, 100% { transform: translateY(0) scaleY(1); }
      30% { transform: translateY(1px) scaleY(.985); }
      72% { transform: translateY(-1px) scaleY(1.015); }
    }
    @keyframes armadillo-head-bob {
      0%, 50%, 100% { transform: translateY(0); }
      25%, 75% { transform: translateY(-1.5px); }
    }
    @keyframes armadillo-step-front {
      0%, 50%, 100% { transform: translate(0, 0); }
      12% { transform: translate(2px, -2px); }
      25% { transform: translate(3.5px, -4.5px); }
      40% { transform: translate(-2px, -1px); }
      75% { transform: translate(-2px, 0); }
    }
    @keyframes armadillo-step-back {
      0%, 50%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 0); }
      62% { transform: translate(2px, -2px); }
      75% { transform: translate(3.5px, -4.5px); }
      90% { transform: translate(-2px, -1px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-armadillo .armadillo-motion { animation: none; }
    }
  </style>
  <!-- The hit area stays still while individual bars move. -->
  <rect width="180" height="110" fill="transparent" pointer-events="all"/>
  <!-- Drawn facing left, mirrored around its centre (x = 95) to face right. -->
  <g transform="matrix(-1 0 0 1 190 0)">
  <g class="armadillo-ink">
    <rect class="armadillo-motion armadillo-tail" x="126" y="65" width="5" height="15" rx="2.5" style="--lift:-1.5px;--drop:1px;--lag:0s"/>
    <rect class="armadillo-motion armadillo-tail" x="134" y="70" width="5" height="13" rx="2.5" style="--lift:-3px;--drop:1.5px;--lag:.06s"/>
    <rect class="armadillo-motion armadillo-tail" x="142" y="74" width="5" height="11" rx="2.5" style="--lift:-4px;--drop:2px;--lag:.12s"/>
    <rect class="armadillo-motion armadillo-tail" x="150" y="77" width="5" height="9" rx="2.5" style="--lift:-5px;--drop:2px;--lag:.18s"/>
    <rect class="armadillo-motion armadillo-tail" x="158" y="79" width="5" height="7" rx="2.5" style="--lift:-6px;--drop:2.5px;--lag:.24s"/>
    <rect class="armadillo-motion armadillo-tail" x="166" y="80" width="5" height="5" rx="2.5" style="--lift:-7px;--drop:2.5px;--lag:.3s"/>
  </g>
  <g class="armadillo-feet">
    <rect class="armadillo-motion armadillo-foot armadillo-foot-a" x="59" y="78" width="5" height="13" rx="2.5"/>
    <rect class="armadillo-motion armadillo-foot armadillo-foot-b" x="69" y="79" width="5" height="12" rx="2.5"/>
    <rect class="armadillo-motion armadillo-foot armadillo-foot-b" x="104" y="79" width="5" height="12" rx="2.5"/>
    <rect class="armadillo-motion armadillo-foot armadillo-foot-a" x="114" y="78" width="5" height="13" rx="2.5"/>
  </g>
  <g class="armadillo-ink">
    <g class="armadillo-motion armadillo-head">
      <rect x="19" y="65" width="5" height="5" rx="2.5"/>
      <rect x="27" y="61" width="5" height="12" rx="2.5"/>
      <rect x="35" y="61" width="5" height="14" rx="2.5"/>
      <rect x="43" y="53" width="5" height="23" rx="2.5"/>
      <rect x="43" y="39" width="5" height="11" rx="2.5"/>
      <circle cx="36.5" cy="56" r="1.8"/>
    </g>
    <rect class="armadillo-motion armadillo-band" x="52" y="48" width="5" height="29" rx="2.5" style="--lag:0s"/>
    <rect class="armadillo-motion armadillo-band" x="61" y="40" width="5" height="38" rx="2.5" style="--lag:.025s"/>
    <rect class="armadillo-motion armadillo-band" x="70" y="35" width="5" height="43" rx="2.5" style="--lag:.05s"/>
    <rect class="armadillo-motion armadillo-band" x="79" y="33" width="5" height="45" rx="2.5" style="--lag:.075s"/>
    <rect class="armadillo-motion armadillo-band" x="88" y="33" width="5" height="45" rx="2.5" style="--lag:.1s"/>
    <rect class="armadillo-motion armadillo-band" x="97" y="36" width="5" height="42" rx="2.5" style="--lag:.125s"/>
    <rect class="armadillo-motion armadillo-band" x="106" y="42" width="5" height="36" rx="2.5" style="--lag:.15s"/>
    <rect class="armadillo-motion armadillo-band" x="115" y="51" width="5" height="25" rx="2.5" style="--lag:.175s"/>
  </g>
  </g>
</svg>
