<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1d1d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rails</title>
    <!-- Appearance before the first paint (theme.ts keeps it current): the saved choice, else the OS. -->
    <script>
      var a;
      try { a = localStorage.getItem("rails.appearance"); } catch (e) {}
      var dark = a === "dark" || (a !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
